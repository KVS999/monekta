<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Монетка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: Telegram Mini App look — native-style top bar, grouped inset list sections on a grey page, iOS-like tab bar.
   Colors read Telegram's theme variables (injected by telegram-web-app.js), with Telegram's default day/night values as fallbacks. */
:root{
  --bg:var(--tg-theme-secondary-bg-color,#EFEFF4);
  --surface:var(--tg-theme-section-bg-color,#FFFFFF);
  --fg:var(--tg-theme-text-color,#000000);
  --muted:var(--tg-theme-hint-color,#8E8E93);
  --head:var(--tg-theme-section-header-text-color,#6D6D72);
  --line:var(--tg-theme-section-separator-color,#E1E1E6);
  --link:var(--tg-theme-link-color,#2481CC);
  --accent:var(--tg-theme-button-color,#2481CC);
  --on-accent:var(--tg-theme-button-text-color,#FFFFFF);
  --bad:var(--tg-theme-destructive-text-color,#E53935);
  --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --good:#31A24C; --warn:#F0952E;
  --bubble-out:#EFFDDE; --chat-bg:#CFDFC0; --bar:rgb(249 249 249 / .94);
  --toast-bg:rgb(0 0 0 / .8); --toast-fg:#FFFFFF;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Segoe UI",system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--tg-theme-secondary-bg-color,#0E1621); --surface:var(--tg-theme-section-bg-color,#17212B);
  --fg:var(--tg-theme-text-color,#F5F5F5); --muted:var(--tg-theme-hint-color,#708499);
  --head:var(--tg-theme-section-header-text-color,#6AB3F3); --line:var(--tg-theme-section-separator-color,#0E1621);
  --link:var(--tg-theme-link-color,#6AB3F3); --accent:var(--tg-theme-button-color,#5288C1);
  --on-accent:var(--tg-theme-button-text-color,#FFFFFF); --bad:var(--tg-theme-destructive-text-color,#EC3942);
  --good:#5FC46A; --warn:#E9A23B; --bubble-out:#2B5278; --chat-bg:#0E1621; --bar:rgb(23 33 43 / .94);
  --toast-bg:rgb(255 255 255 / .14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--tg-theme-secondary-bg-color,#0E1621); --surface:var(--tg-theme-section-bg-color,#17212B);
  --fg:var(--tg-theme-text-color,#F5F5F5); --muted:var(--tg-theme-hint-color,#708499);
  --head:var(--tg-theme-section-header-text-color,#6AB3F3); --line:var(--tg-theme-section-separator-color,#0E1621);
  --link:var(--tg-theme-link-color,#6AB3F3); --accent:var(--tg-theme-button-color,#5288C1);
  --on-accent:var(--tg-theme-button-text-color,#FFFFFF); --bad:var(--tg-theme-destructive-text-color,#EC3942);
  --good:#5FC46A; --warn:#E9A23B; --bubble-out:#2B5278; --chat-bg:#0E1621; --bar:rgb(23 33 43 / .94);
  --toast-bg:rgb(255 255 255 / .14); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

.monthrow{display:flex;justify-content:center;padding-block:10px 4px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:10px;padding:2px}
.month button{border:0;background:none;width:32px;height:30px;border-radius:8px;font-size:20px;color:var(--link)}
.month button:disabled{opacity:.3;cursor:default}
.month span{min-width:110px;text-align:center;font-weight:600;font-size:15px}

/* Section headers like Telegram settings */
h2{font-family:var(--font-body);font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--head);margin:24px 0 7px;padding-inline:16px;text-wrap:balance}
.sheet h2,.support h2{font-size:17px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg);padding:0}
.label{font-size:13px;color:var(--muted)}

/* Wallet-style balance on the page background */
.hero{display:grid;justify-items:center;text-align:center;gap:12px;padding-block:14px 4px}
.hero .total{font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1.1}
.hero .row{display:grid;grid-template-columns:1fr 1fr;width:100%;background:var(--surface);border-radius:var(--r)}
.hero .row div{display:grid;gap:2px;padding:10px 12px}
.hero .row div+div{border-left:1px solid var(--line)}
.hero .row b{font-weight:600;font-size:17px}
.hero .row div:first-child b{color:var(--good)}

/* Accounts as a list section */
.accounts{background:var(--surface);border-radius:var(--r);overflow:hidden}
.acc{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n v" "c v";align-items:center;column-gap:12px;padding:10px 16px;min-width:0}
.acc{position:relative}
.acc+.acc::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.acc .n{grid-area:n;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .c{grid-area:c;font-size:13px;color:var(--muted)}
.acc .v{grid-area:v;font-weight:600;font-size:16px}

.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.day{font-size:13px;color:var(--muted);padding:9px 16px 3px}
.tx{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;border:0;background:none;text-align:left;position:relative}
.tx:active{background:var(--accent-soft)}
.tx+.tx::before{content:"";position:absolute;left:64px;right:0;top:0;border-top:1px solid var(--line)}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.tx .mid{flex:1;min-width:0;display:grid}
.tx .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;white-space:nowrap}
.tx .a.in{color:var(--good)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:15px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;color:var(--link);text-align:left;font-size:16px}

/* Segmented filter */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* Budgets as one grouped section */
.budgets{display:grid;background:var(--surface);border-radius:var(--r);overflow:hidden}
.budget{background:none;padding:12px 16px;display:grid;gap:7px;position:relative}
button.budget{width:100%;text-align:left;font:inherit;color:inherit;border:0}
button.budget:active{background:var(--accent-soft)}
.budget+.budget::before,.budgets>.addlim::before{content:"";position:absolute;left:58px;right:0;top:0;border-top:1px solid var(--line)}
.budget .h{display:flex;align-items:center;gap:12px}
.budget .h .ico{width:30px;height:30px;font-size:15px}
.budget .h .nm{flex:1;font-size:16px}
.budget .h::after{content:"›";color:var(--muted);font-size:20px;line-height:1}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--muted) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.budget .bar,.budget .f,.budget .pace{margin-left:42px}
.budget .f{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.budget .f b{color:var(--fg);font-weight:600}
.pace{font-size:13px;color:var(--muted)}
.addlim{position:relative;border:0;background:none;text-align:left;padding:12px 16px 12px 58px;color:var(--link);font-size:16px}
.budgets>.addlim:only-child::before{display:none}

.card{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{flex:none}
.legend{flex:1;min-width:170px;display:grid;gap:7px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted);min-width:34px;text-align:right}
.bars-wrap{overflow-x:auto}
.bars svg text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* Tab bar like Telegram's */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:5px max(8px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:480px}
.tab{position:relative;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);padding:3px 0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--link)}

/* Bottom sheets */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92%;overflow-y:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--muted) 45%,transparent);justify-self:center}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:color-mix(in srgb,var(--muted) 18%,transparent);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:7px;border-radius:7px;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.amount{display:flex;align-items:baseline;gap:8px;justify-content:center}
.amount input{font-family:var(--font-display);font-weight:700;font-size:40px;border:0;background:none;color:var(--fg);text-align:center;width:100%;min-width:0;padding:0}
.amount input::placeholder{color:color-mix(in srgb,var(--muted) 50%,transparent)}
.amount .cur{font-family:var(--font-display);font-size:24px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{border:0;background:var(--surface);border-radius:12px;padding:9px 4px;display:grid;justify-items:center;gap:4px;font-size:12px;min-width:0}
.cat span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--head);text-transform:uppercase;padding-inline:4px}
.field input,.field select{border:0;background:var(--surface);color:var(--fg);border-radius:10px;padding:12px;font:inherit;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:14px;font-weight:600;font-size:16px}
.primary:disabled{opacity:.45;cursor:default}
.danger{border:0;background:var(--surface);color:var(--bad);border-radius:10px;padding:13px;font-size:16px}
.err{color:var(--bad);font-size:13px;text-align:center;min-height:1em}

/* Quick entry */
.quick{background:var(--surface);border-radius:var(--r);padding:12px 16px;display:grid;gap:8px;margin-top:16px}
.quick .rowi{display:flex;gap:8px}
.quick input{flex:1;min-width:0;border:0;background:var(--bg);color:var(--fg);border-radius:18px;padding:9px 14px;font:inherit}
.send{border:0;background:var(--accent);color:var(--on-accent);border-radius:50%;width:38px;height:38px;flex:none;font-size:18px;font-weight:700}
.send:disabled{opacity:.35;cursor:default}
.preview{font-size:14px;color:var(--muted);min-height:18px;display:grid;gap:2px}
.preview b{color:var(--fg);font-weight:600}
.linkbtn{border:0;background:none;color:var(--link);font-size:15px;padding:0;justify-self:start}


/* Support */
.support{margin-top:24px;background:var(--surface);border-radius:var(--r);padding:20px 16px;display:grid;gap:12px;justify-items:center;text-align:center}
.support p{margin:0;color:var(--muted);font-size:15px;max-width:34ch}
.star{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#FFFFFF;background:linear-gradient(160deg,#FFC93D,#F59A0B)}
/* Smoother buttons: larger radii, soft press feedback */
.primary,.danger{border-radius:16px}
.primary{box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 28%,transparent)}
.cat{border-radius:16px}
.seg{border-radius:12px}.seg button{border-radius:10px}
.field input,.field select{border-radius:14px}
.month{border-radius:14px}.month button{border-radius:12px}
.chip{padding:7px 15px}
.quick input,.composer input{border-radius:22px}
button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,box-shadow .2s,opacity .2s}
button:not(:disabled):active{transform:scale(.96)}
.tx:not(:disabled):active,button.budget:not(:disabled):active,.more:active,.addlim:active{transform:none}
.primary:not(:disabled):active{box-shadow:0 1px 4px color-mix(in srgb,var(--accent) 22%,transparent)}
@media (hover:hover){.primary:not(:disabled):hover,.send:not(:disabled):hover{filter:brightness(1.06)}.kb button:not(:disabled):hover,.chip:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}.chip[aria-pressed="true"]:hover{background:var(--accent)}}
@media (prefers-reduced-motion:reduce){button{transition:none}button:not(:disabled):active{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);backdrop-filter:blur(10px);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
button.acc{width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit}
button.acc:active{background:var(--accent-soft)}
.accounts .more{position:relative}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="monthrow" hidden><div class="month">
    <button id="mPrev" aria-label="Предыдущий месяц">‹</button>
    <span id="mLabel" class="num"></span>
    <button id="mNext" aria-label="Следующий месяц">›</button>
  </div></div>
  <main id="screen"><div class="loading">Загружаю…</div></main>
</div>

<nav class="tabs"><div class="in">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button class="tab" data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Операции</button>
  <button class="tab" data-tab="budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Бюджеты</button>
  <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Статистика</button>
</div></nav>

<div id="sheetHost"></div>
<script src="config.js"></script>
<script src="parser.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
